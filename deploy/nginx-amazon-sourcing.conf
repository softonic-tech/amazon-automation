# /etc/nginx/sites-available/amazon-sourcing
#
# Reverse proxy for the Flask/gunicorn app on 127.0.0.1:5000.
# Authentication is handled by the Flask app itself (branded login page +
# signed-cookie session). nginx just does TLS termination + proxying.
#
# If port 80 is already taken (e.g. Hostinger VPS templates that ship with
# Coolify / EasyPanel / Docker control panels), setup_vps.sh rewrites the
# listen lines to LISTEN_PORT (default 80).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Large XLSX downloads and slow scraper logs.
    client_max_body_size 25M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming log endpoint — don't buffer.
        proxy_buffering    off;
    }
}
