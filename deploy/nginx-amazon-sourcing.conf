# /etc/nginx/sites-available/amazon-sourcing
#
# Reverse proxy for the Flask/gunicorn app on 127.0.0.1:5000.
# Basic auth protects the whole site; credentials live in /etc/nginx/.htpasswd.
#
# If port 80 is already taken (e.g. Hostinger VPS templates that ship with
# Coolify / EasyPanel / Docker control panels), setup_vps.sh will rewrite
# these listen lines to LISTEN_PORT (default 80). The env var LISTEN_PORT
# controls the fallback port.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Serve on any hostname / raw IP for now. Once a domain is added, replace
    # `_` with `server_name sourcing.example.com;` and run certbot for HTTPS.
    server_name _;

    # Large XLSX downloads and slow scraper logs.
    client_max_body_size 25M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # Basic auth — protects everything.
    auth_basic "Amazon Sourcing Tool";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming log endpoint — don't buffer.
        proxy_buffering    off;
    }
}
